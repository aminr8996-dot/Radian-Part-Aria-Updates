<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b80f16">
<title>رادیان پارت آریا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#fff;color:#231f20}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.box{width:min(100%,420px);text-align:center}.logo{width:min(58vw,220px);height:auto;display:block;margin:0 auto 18px;object-fit:contain}.title{font-size:25px;font-weight:900;margin-bottom:26px}.menu{display:grid;gap:12px}.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:60px;border-radius:16px;font-size:17px;font-weight:900;padding:12px}.apk{background:#b80f16;color:#fff;box-shadow:0 8px 22px rgba(184,15,22,.18)}.html{background:#fff7f7;color:#8f1118;border:1px solid #ead3d5}.share{width:100%;border:1px solid #d0d5dd;background:#fff;color:#344054;cursor:pointer}.foot{font-size:11px;color:#98a2b3;margin-top:18px}
</style>
</head>
<body>
<main class="box">
<img class="logo" src="logo.png?v=3411" alt="لوگوی رادیان پارت آریا">
<div class="title">رادیان پارت آریا</div>
<div class="menu">
<a class="btn apk" href="Radian-Part-Aria.apk" download>دانلود و نصب برنامه اندروید (APK)</a>
<a class="btn html" href="index.html">اجرای نسخه HTML</a>
<button class="btn share" id="shareBtn" type="button">اشتراک‌گذاری همین لینک</button>
</div>
<div class="foot">نسخه 3.4.1</div>
</main>
<script>
document.getElementById('shareBtn').addEventListener('click',async()=>{const data={title:'رادیان پارت آریا',text:'دانلود یا اجرای برنامه رادیان پارت آریا',url:location.href};try{if(navigator.share){await navigator.share(data)}else{await navigator.clipboard.writeText(location.href);alert('لینک کپی شد')}}catch(e){}});
</script>
</body>
</html>
