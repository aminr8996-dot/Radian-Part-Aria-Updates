name: Publish Radian APK

on:
  push:
    branches: [main]
    paths:
      - 'apk_parts/**'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild APK
        run: |
          cat apk_parts/part_00.bin apk_parts/part_01.bin apk_parts/part_02.bin apk_parts/part_03.bin apk_parts/part_04.bin apk_parts/part_05.bin apk_parts/part_06.bin apk_parts/part_07.bin > Radian-Part-Aria.apk
          test "$(wc -c < Radian-Part-Aria.apk)" -eq 71030
          echo "349594a9fdbfd192461412019d985900372c4f28b00fd934cc85a5ede78004fa  Radian-Part-Aria.apk" | sha256sum -c -
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Radian-Part-Aria.apk --clobber
          else
            gh release create "$TAG" Radian-Part-Aria.apk --title "رادیان پارت آریا 3.3.0" --notes "نسخه نصب اندروید رادیان پارت آریا"
          fi
