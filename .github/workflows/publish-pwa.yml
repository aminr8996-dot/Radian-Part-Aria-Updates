name: Deploy Radian customer PWA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radian-pwa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare latest APK and customer page
        run: |
          curl -L --fail 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-e718-81f4-8509-bccca61d0551/raw?se=2026-08-29T19%3A56%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=645be232-c5a8-549c-9cf3-de48823b1892&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T20%3A52%3A20Z&ske=2026-08-29T20%3A52%3A20Z&sks=b&skv=2026-02-06&sig=DgeRXndQ0zJqFENRVglIS0EUYD0eAtbAGGufTyDhreY%3D' -o /tmp/radian-apk.zip
          unzip -o /tmp/radian-apk.zip -d /tmp/radian-apk
          cp /tmp/radian-apk/Radian-Part-Aria-v3.4.1.apk pwa/Radian-Part-Aria.apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pwa/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="manifest"[^>]*>', '', s)
          s=re.sub(r'<meta name="mobile-web-app-capable"[^>]*>', '', s)
          s=re.sub(r'<meta name="apple-mobile-web-app-capable"[^>]*>', '', s)
          s=re.sub(r'<script src="install-fix-v2\.js[^>]*></script>', '', s)
          s=s.replace('>نصب روی گوشی</button>', '>نصب کامل برنامه</button>')
          s=s.replace('src="pwa.js"','src="pwa.js?v=3412"')
          s=s.replace('src="logo.png"','src="logo.png?v=3412"')
          s=s.replace('href="logo.png"','href="logo.png?v=3412"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload customer page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pwa

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
