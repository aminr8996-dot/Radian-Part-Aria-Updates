name: Deploy Radian customer PWA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radian-pwa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare latest APK and customer page
        run: |
          curl -L --fail 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-3d54-820a-837d-6728eb65cb0f/raw?se=2026-08-29T23%3A16%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=a40ae84e-ae1d-5a86-867c-07cb5de601e8&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T18%3A42%3A03Z&ske=2026-08-30T18%3A42%3A03Z&sks=b&skv=2026-02-06&sig=LnmtxMMilxuXeYk05Of14bZTjsY3GQELIFeZ1eYtMV0%3D' -o /tmp/radian-apk.zip
          rm -rf /tmp/radian-apk && mkdir -p /tmp/radian-apk
          unzip -o /tmp/radian-apk.zip -d /tmp/radian-apk
          cp /tmp/radian-apk/Radian-Part-Aria-v3.4.1.apk Radian-Part-Aria.apk
          cp Radian-Part-Aria.apk pwa/Radian-Part-Aria.apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pwa/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="manifest"[^>]*>', '', s)
          s=re.sub(r'<meta name="mobile-web-app-capable"[^>]*>', '', s)
          s=re.sub(r'<meta name="apple-mobile-web-app-capable"[^>]*>', '', s)
          s=re.sub(r'<script src="install-fix-v2\.js[^>]*></script>', '', s)
          s=s.replace('>نصب روی گوشی</button>', '>نصب کامل برنامه</button>')
          s=s.replace('src="pwa.js"','src="pwa.js?v=3417"')
          s=s.replace('src="excel_catalog_fix.js?v=1"','src="excel_catalog_fix.js?v=2"')
          s=s.replace('src="logo.png"','src="logo.png?v=3417"')
          s=s.replace('href="logo.png"','href="logo.png?v=3417"')
          s=s.replace('href="style_v33_2.css"','href="style_v33_2.css?v=3417"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Persist latest APK
        run: |
          if ! git diff --quiet -- Radian-Part-Aria.apk || ! git ls-files --error-unmatch Radian-Part-Aria.apk >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Radian-Part-Aria.apk
            git commit -m "Update customer APK [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload customer page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pwa

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
