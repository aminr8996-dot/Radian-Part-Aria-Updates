name: Deploy Radian customer PWA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radian-pwa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare latest APK and customer page
        run: |
          curl -L --fail 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-fce8-820a-9b18-b55e93ae8457/raw?se=2026-08-29T21%3A15%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=72c07c4c-2e84-54f5-a225-5fd63635a0d0&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T05%3A55%3A36Z&ske=2026-08-30T05%3A55%3A36Z&sks=b&skv=2026-02-06&sig=wM2z5BbA1Na2HsZ9i4jJi8F9MFksMz50ARbm9jF9aR4%3D' -o /tmp/radian-apk.zip
          unzip -o /tmp/radian-apk.zip -d /tmp/radian-apk
          cp /tmp/radian-apk/Radian-Part-Aria-v3.4.1.apk pwa/Radian-Part-Aria.apk
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pwa/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="manifest"[^>]*>', '', s)
          s=re.sub(r'<meta name="mobile-web-app-capable"[^>]*>', '', s)
          s=re.sub(r'<meta name="apple-mobile-web-app-capable"[^>]*>', '', s)
          s=re.sub(r'<script src="install-fix-v2\.js[^>]*></script>', '', s)
          s=s.replace('>نصب روی گوشی</button>', '>نصب کامل برنامه</button>')
          s=s.replace('src="pwa.js"','src="pwa.js?v=3415"')
          s=s.replace('src="logo.png"','src="logo.png?v=3415"')
          s=s.replace('href="logo.png"','href="logo.png?v=3415"')
          s=s.replace('href="style_v33_2.css"','href="style_v33_2.css?v=3415"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload customer page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pwa

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
