name: Publish stable APK

on:
  push:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      APK_ZIP_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-e3d8-820a-9c8e-e6fcfb234fbc/raw?se=2026-08-29T18%3A11%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=47a2592b-b3de-53b6-9ecf-f48a28a507da&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T09%3A16%3A48Z&ske=2026-08-30T09%3A16%3A48Z&sks=b&skv=2026-02-06&sig=QNeL4vmhyCwkkuDrQmEb%2B4Uf5yTpj1BV5diaK5%2BSV5s%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        run: |
          curl -fL "$APK_ZIP_URL" -o /tmp/radian-apk.zip
          rm -rf /tmp/radian-apk && mkdir -p /tmp/radian-apk
          unzip -q /tmp/radian-apk.zip -d /tmp/radian-apk
          test "$(stat -c%s /tmp/radian-apk/Radian-Part-Aria-v3.3.0.apk)" -eq 71030
          echo "349594a9fdbfd192461412019d985900372c4f28b00fd934cc85a5ede78004fa  /tmp/radian-apk/Radian-Part-Aria-v3.3.0.apk" | sha256sum -c -
          cp /tmp/radian-apk/Radian-Part-Aria-v3.3.0.apk Radian-Part-Aria.apk
      - name: Commit stable APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Radian-Part-Aria.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish complete Radian Part Aria v3.3.0 APK"
          git push
