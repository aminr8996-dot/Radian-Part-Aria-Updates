<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت بروزرسانی رادیان پارت آریا</title><style>body{font-family:Tahoma,Arial;background:#f5f7fa;color:#172b4d;margin:0;padding:20px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 3px 14px #0000000b}h1{font-size:22px;margin:0 0 5px}.sub{color:#667085;font-size:12px;margin-bottom:18px}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;border:1px solid #ccd5e1;border-radius:10px;padding:11px;font:inherit}button{width:100%;border:0;border-radius:11px;min-height:48px;font:inherit;font-weight:900;margin-top:10px;cursor:pointer}.primary{background:#1f6feb;color:white}.secondary{background:#eef2f6;color:#344054}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{margin-top:12px;border-radius:10px;padding:10px;background:#f8fafc;font-size:12px;line-height:1.8}.ok{background:#ecfdf3;color:#027a48}.err{background:#fef3f2;color:#b42318}.count{font-size:28px;font-weight:900}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>مرکز بروزرسانی رادیان پارت آریا</h1><div class="sub">Excel جدید را انتخاب کنید؛ قیمت، تعداد در کارتن و واحد به اپ مشتری‌ها منتقل می‌شود.</div><label>فایل Excel لیست کالا</label><input id="file" type="file" accept=".xlsx,.xls"><div class="grid"><div><label>نسخه لیست قیمت</label><input id="version" placeholder="مثلاً 1405-06-08-002"></div><div><label>تاریخ شمسی لیست</label><input id="dateFa" placeholder="مثلاً ۱۴۰۵/۰۶/۰۸"></div></div><div id="parseStatus" class="status">هنوز فایلی انتخاب نشده است.</div></div><div class="card"><h3>انتشار مستقیم</h3><div class="sub">این مشخصات فقط برای زمان انتشار استفاده می‌شوند. توکن در فایل ذخیره نمی‌شود.</div><label>GitHub Token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><div class="grid"><div><label>مالک</label><input id="owner" value="aminr8996-dot"></div><div><label>مخزن</label><input id="repo" value="Radian-Part-Aria-Updates"></div></div><button id="publish" class="primary" disabled>انتشار لیست جدید</button><button id="download" class="secondary" disabled>دانلود فایل‌های بروزرسانی</button><div id="publishStatus" class="status">پس از انتخاب Excel، آماده انتشار می‌شود.</div></div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
let payload=null,versionPayload=null;
const $=id=>document.getElementById(id);const faDigits=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function status(id,msg,kind=''){const e=$(id);e.className='status '+kind;e.innerHTML=msg}
function val(row,names){for(const n of names){if(Object.prototype.hasOwnProperty.call(row,n)&&row[n]!==undefined&&row[n]!==null&&row[n]!=='')return row[n]}return ''}
function b64utf8(s){const bytes=new TextEncoder().encode(s);let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
function isoDate(){return new Date().toISOString()}
function autoVersion(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
$('version').value=autoVersion();$('dateFa').value=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
$('file').addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;status('parseStatus','در حال خواندن Excel...');const data=await f.arrayBuffer();const wb=XLSX.read(data,{type:'array'});const sheet=wb.Sheets['ورودی اپ']||wb.Sheets[wb.SheetNames[0]];const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});const headerIndex=matrix.findIndex(r=>r.some(v=>String(v).trim()==='نام کالا')&&r.some(v=>String(v).trim()==='کد کالا'));if(headerIndex<0)throw new Error('سطر عنوان ستون‌ها پیدا نشد. ستون‌های «نام کالا» و «کد کالا» لازم هستند.');const headers=matrix[headerIndex].map(v=>String(v).trim());let rows=matrix.slice(headerIndex+1).map(arr=>Object.fromEntries(headers.map((h,i)=>[h,arr[i]??''])));rows=rows.filter(r=>String(val(r,['نام کالا','نام','کالا'])).trim());const products=rows.map((r,i)=>{const name=String(val(r,['نام کالا','نام','کالا'])).trim(),code=String(val(r,['کد کالا','کد'])).trim(),group=String(val(r,['گروه','دسته'])).trim()||'سایر';let price=val(r,['قیمت (ریال)','قیمت','لیست قیمت آراد',' لیست قیمت آراد']);price=price===''?null:Number(faDigits(price));if(!Number.isFinite(price))price=null;let pack=val(r,['تعداد در کارتن','تعداد کارتن']);pack=pack===''?null:Number(faDigits(pack));if(!Number.isFinite(pack))pack=null;const unit=String(val(r,['واحد','واحد کالا'])).trim();return {row:i+1,seq:Number(val(r,['ردیف']))||i+1,name,code,price,group,packQty:pack,unit}});if(!products.length)throw new Error('هیچ کالایی در فایل پیدا نشد. بهتر است شیت «ورودی اپ» وجود داشته باشد.');const ver=$('version').value.trim()||autoVersion(),dateFa=$('dateFa').value.trim()||'—';payload={schemaVersion:1,catalogVersion:ver,publishedAt:isoDate(),releaseDateFa:dateFa,releaseDateG:new Date().toISOString().slice(0,10).replaceAll('-','/'),currency:'IRR',products};versionPayload={schemaVersion:1,catalogVersion:ver,releaseDateFa:dateFa,releaseDateG:payload.releaseDateG,publishedAt:payload.publishedAt,catalogUrl:'catalog.json',message:'لیست قیمت رادیان پارت آریا'};$('publish').disabled=false;$('download').disabled=false;status('parseStatus',`<div class="count">${products.length.toLocaleString('fa-IR')}</div> کالا آماده انتشار است.<br>ستون‌های قابل استفاده: نام کالا، کد کالا، گروه، قیمت، تعداد در کارتن، واحد`,'ok')}catch(err){payload=null;versionPayload=null;$('publish').disabled=true;$('download').disabled=true;status('parseStatus','خطا: '+err.message,'err')}});
async function putFile(path,obj,token,owner,repo){const api=`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path}`;let sha='';const head=await fetch(api,{headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json'}});if(head.ok){const j=await head.json();sha=j.sha||''}else if(head.status!==404)throw new Error('امکان خواندن مخزن وجود ندارد ('+head.status+')');const body={message:`Publish Radian catalog ${versionPayload.catalogVersion}`,content:b64utf8(JSON.stringify(obj,null,2)),branch:'main'};if(sha)body.sha=sha;const r=await fetch(api,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('انتشار '+path+' انجام نشد ('+r.status+')')}
$('publish').addEventListener('click',async()=>{if(!payload)return;const token=$('token').value.trim(),owner=$('owner').value.trim(),repo=$('repo').value.trim();if(!token)return status('publishStatus','GitHub Token را وارد کنید.','err');$('publish').disabled=true;try{versionPayload.catalogVersion=$('version').value.trim()||versionPayload.catalogVersion;payload.catalogVersion=versionPayload.catalogVersion;versionPayload.releaseDateFa=$('dateFa').value.trim()||versionPayload.releaseDateFa;payload.releaseDateFa=versionPayload.releaseDateFa;payload.publishedAt=versionPayload.publishedAt=isoDate();status('publishStatus','در حال انتشار catalog.json ...');await putFile('catalog.json',payload,token,owner,repo);status('publishStatus','در حال انتشار شماره نسخه ...');await putFile('catalog-version.json',versionPayload,token,owner,repo);status('publishStatus',`انتشار با موفقیت انجام شد.<br><b>نسخه ${versionPayload.catalogVersion}</b><br>از این لحظه اپ مشتری‌ها می‌تواند لیست جدید را دریافت کند.`,'ok')}catch(err){status('publishStatus','خطا: '+err.message,'err')}finally{$('publish').disabled=false}});
$('download').addEventListener('click',()=>{if(!payload)return;for(const [name,obj] of [['catalog.json',payload],['catalog-version.json',versionPayload]]){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}});
</script></body></html>
